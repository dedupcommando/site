# DedupCommando landing — Zola configuration.
# Static, multilingual (9 locales) marketing site. English is canonical at /en/;
# every language is locale-prefixed; / is the x-default entry.
#
# Locales are modelled as plain sections (content/<slug>/_index.md), NOT Zola's
# built-in [languages] table, so every language (including English) gets a
# /<slug>/ prefix and we keep full control of slugs (/zh-hans/, /pt-br/) and of
# the hreflang cluster.

base_url = "https://dedcom.dequzzy.io"
title = "DedupCommando"
description = "Safety-focused Linux CLI and TUI for finding duplicate files and reclaiming storage."
default_language = "en"
compile_sass = false

[markdown]
highlight_code = false

[extra]
# The released version is not written here: scripts/sync_docs.py puts it in data/release.json.
repo_url = "https://github.com/dedupcommando/DedupCommando"
# Visit counter endpoint. The page shows nothing; the script is served by the site itself
# (static/assets/goatcounter.v5.js). Empty string = no counter.
goatcounter = "https://oldman007.goatcounter.com/count"
# Published locales. `home` is the content path of each locale's home page: the hreflang cluster, the
# language switcher and x-default (the "en" home) are all built from it.
locales = [
  { slug = "en",      home = "@/_index.md",         hreflang = "en",      name = "English",            dir = "ltr", og_locale = "en_US" },
  { slug = "ar",      home = "@/ar/_index.md",      hreflang = "ar",      name = "العربية",             dir = "rtl", og_locale = "ar_AR" },
  { slug = "vi",      home = "@/vi/_index.md",      hreflang = "vi",      name = "Tiếng Việt",         dir = "ltr", og_locale = "vi_VN" },
  { slug = "es",      home = "@/es/_index.md",      hreflang = "es",      name = "Español",            dir = "ltr", og_locale = "es_ES" },
  { slug = "zh-hans", home = "@/zh-hans/_index.md", hreflang = "zh-Hans", name = "简体中文",            dir = "ltr", og_locale = "zh_CN" },
  { slug = "pt-br",   home = "@/pt-br/_index.md",   hreflang = "pt-BR",   name = "Português (Brasil)", dir = "ltr", og_locale = "pt_BR" },
  { slug = "ru",      home = "@/ru/_index.md",      hreflang = "ru",      name = "Русский",            dir = "ltr", og_locale = "ru_RU" },
  { slug = "fr",      home = "@/fr/_index.md",      hreflang = "fr",      name = "Français",           dir = "ltr", og_locale = "fr_FR" },
  { slug = "hi",      home = "@/hi/_index.md",      hreflang = "hi",      name = "हिन्दी",               dir = "ltr", og_locale = "hi_IN" },
]

# Breadcrumb trail entries. Generated pages name them in `extra.crumbs` (e.g. ["docs", "manual"]);
# the trail always starts at the English home.
[extra.crumbs]
docs = { name = "Docs", path = "@/en/_index.md" }
manual = { name = "Manual", path = "@/en/manual/_index.md" }
changelog = { name = "Release notes", path = "@/en/changelog/_index.md" }
